# cargo-deny configuration (verification check V-L0-07).
# Keep the policy minimal; tighten only with human review when the
# dependency set grows.

[graph]
all-features = true

[advisories]
version = 2

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
