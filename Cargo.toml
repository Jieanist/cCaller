[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "BSD-2-Clause"
repository = "https://github.com/Jieanist/cCaller"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# The group needs an explicit lower priority so the per-lint `warn`
# overrides below survive; required by clippy >= 1.80 (lint_groups_priority).
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
