[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "BSD-2-Clause"
repository = "https://github.com/Jieanist/cCaller"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# The group needs an explicit lower priority so the per-lint `warn`
# overrides below survive; required by clippy >= 1.80 (lint_groups_priority).
all = { level = "deny", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
# Style guide section 6.1 mandates thiserror for per-crate error types.
thiserror = "2"
# serde: strict derive models with deny_unknown_fields (FR-C-09); toml:
# the only configuration input format in v1.0 (requirement spec 7.2/7.3)
# and the only crate whose spans map errors back to line/column (FR-C-10).
# Hand-rolling a TOML parser with span tracking is error-prone.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# serde_json: the machine-readable report contract of requirement spec
# 7.6 (`check`/`expand` --format json). Owned by core so the CLI stays a
# thin shell and the contract stays testable without it.
serde_json = "1"
# clap: subcommand CLI with aliases and generated help (FR-X-01); hand-
# rolling this is error-prone. log/env_logger: FR-R-02 leveled logging
# with RUST_LOG override; env_logger writes to stderr by default.
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
